<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#09090b" />
    <meta name="description" content="Render - api" />
    <link rel="icon" href="%PUBLIC_URL%/logo.png" />
    <title>Render</title>
    <style>
      #boot-splash {
        position: fixed;
        inset: 0;
        z-index: 200000;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #09090b;
        pointer-events: none;
        opacity: 1;
        transition: opacity 0.48s ease;
      }
      #boot-splash.is-done { opacity: 0; }
      #boot-splash .boot-splash__orbit {
        position: absolute;
        width: 132px;
        height: 132px;
        border-radius: 50%;
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-top-color: rgba(255, 255, 255, 0.55);
        animation: boot-spin 1.05s linear infinite;
      }
      #boot-splash .boot-splash__logo {
        width: 86px;
        height: 86px;
        object-fit: contain;
        mix-blend-mode: screen;
        animation: boot-spin 1.35s linear infinite;
        filter: drop-shadow(0 0 18px rgba(255, 255, 255, 0.22));
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body>
    <noscript>Включите JavaScript для работы приложения.</noscript>
    <script>window.__RENDER_BOOT_AT = Date.now();</script>
    <div id="boot-splash" class="boot-splash" aria-hidden="true">
      <div class="boot-splash__orbit"></div>
      <img class="boot-splash__logo" src="%PUBLIC_URL%/logo.png" alt="" />
    </div>
    <div id="root"></div>
  </body>
</html>
